<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192-2.png">
<link rel="apple-touch-icon" href="/icon-192-2.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Friday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #070b16;
    --deep: #0e1428;
    --ember: #ff8a3d;
    --glow: #ffd9a0;
    --plum: #7a2f6b;
    --frost: #8fc4ff;
    --text: #eef0f7;
    --muted: #8a92ab;
    --line: #232b47;
    --orb: clamp(150px, 30dvh, 260px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 70% at 50% 0%, #141a35 0%, var(--night) 60%);
    color: var(--text);
    font-family: "Instrument Sans", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 0; padding-top: max(14px, env(safe-area-inset-top));
  }
  h1 {
    margin: 0; font-family: "Syne", sans-serif; font-weight: 700;
    font-size: 22px; letter-spacing: 0.02em;
  }
  .tools { display: flex; gap: 8px; }
  .chip {
    font: inherit; font-size: 13px; color: var(--muted);
    background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { color: var(--glow); border-color: #5a3a2a; }
  .chip:focus-visible, #orb:focus-visible, #send:focus-visible, #input:focus-visible {
    outline: 2px solid var(--frost); outline-offset: 3px;
  }

  /* ---- the orb ---- */
  .stage { display: grid; place-items: center; padding: 10px 0 4px; }
  #orb {
    position: relative; width: var(--orb); height: var(--orb);
    border: 0; padding: 0; background: none; cursor: pointer;
    border-radius: 50%; -webkit-tap-highlight-color: transparent;
  }
  .core, .halo, .ring { position: absolute; inset: 0; border-radius: 50%; }
  .core {
    background: radial-gradient(circle at 38% 32%, #fff6e6 0%, var(--glow) 18%, var(--ember) 46%, var(--plum) 80%, #2a1233 100%);
    box-shadow: 0 0 50px 8px rgba(255,138,61,.45), 0 0 130px 36px rgba(122,47,107,.35);
    animation: breathe 6s ease-in-out infinite;
    transition: filter .6s ease;
  }
  .halo {
    inset: -14%;
    background: radial-gradient(circle, rgba(255,138,61,.18) 40%, transparent 70%);
    animation: breathe 6s ease-in-out infinite reverse;
  }
  .ring {
    inset: -7%;
    background: conic-gradient(from 0deg, transparent 0 55%, rgba(255,217,160,.9) 75%, transparent 100%);
    -webkit-mask: radial-gradient(circle, transparent 66%, #000 67%, #000 69%, transparent 70%);
            mask: radial-gradient(circle, transparent 66%, #000 67%, #000 69%, transparent 70%);
    opacity: .35; animation: spin 14s linear infinite;
  }
  #orb[data-state="listening"] .core { filter: hue-rotate(185deg) saturate(1.2); animation: listen 1.2s ease-in-out infinite; }
  #orb[data-state="listening"] .ring { opacity: .8; animation-duration: 4s; }
  #orb[data-state="thinking"] .ring { opacity: 1; animation-duration: 1.1s; }
  #orb[data-state="speaking"] .core { animation: speak .8s ease-in-out infinite; }
  #orb[data-state="speaking"] .ring { opacity: .7; animation-duration: 6s; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
  @keyframes listen { 0%,100% { transform: scale(.97); } 50% { transform: scale(1.08); } }
  @keyframes speak { 0%,100% { transform: scale(1); } 30% { transform: scale(1.07); } 60% { transform: scale(.98); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { margin: 14px 0 0; font-size: 14px; color: var(--muted); min-height: 21px; text-align: center; }

  /* ---- conversation ---- */
  #log {
    flex: 1; overflow-y: auto; padding: 8px 16px 12px;
    display: flex; flex-direction: column; gap: 10px;
    mask-image: linear-gradient(to bottom, transparent 0, #000 18px);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 18px);
  }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: #17264a; color: #dbe9ff; border-bottom-right-radius: 5px; }
  .bot { align-self: flex-start; background: var(--deep); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
  .bot.pending { color: var(--muted); }
  .bot.error { border-color: #6b2a2a; color: #ffb4b4; }

  /* ---- input ---- */
  .bar {
    display: flex; gap: 8px; padding: 10px 12px; padding-bottom: max(12px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: rgba(7,11,22,.85);
  }
  #input {
    flex: 1; min-width: 0; font: inherit; color: var(--text);
    background: var(--deep); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px;
  }
  #input::placeholder { color: #5d667f; }
  #send {
    font: inherit; font-weight: 600; color: #1a0d05; background: var(--ember);
    border: 0; border-radius: 14px; padding: 0 18px; cursor: pointer;
  }
  #send:disabled { opacity: .5; }
  #send { align-self: stretch; }

  .tools { flex-wrap: wrap; justify-content: flex-end; }
  #memPanel {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end;
    background: rgba(3,5,12,.72);
  }
  #memPanel[hidden] { display: none; }
  .sheet {
    width: 100%; max-height: 75dvh; overflow-y: auto;
    background: var(--deep); border-top: 1px solid var(--line);
    border-radius: 20px 20px 0 0; padding: 18px 16px; padding-bottom: max(18px, env(safe-area-inset-bottom));
  }
  .sheet h2 { margin: 0 0 4px; font-family: "Syne", sans-serif; font-size: 18px; }
  .sheet p.hint { margin: 0 0 14px; font-size: 14px; color: var(--muted); }
  .fact { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .fact span { flex: 1; }
  .fact button { font: inherit; font-size: 13px; color: #ffb4b4; background: none; border: 1px solid #4a2a2f; border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  .sheet-actions { display: flex; gap: 8px; margin-top: 16px; }
  .sheet-actions .chip { flex: 1; padding: 10px; }

  @media (prefers-reduced-motion: reduce) {
    .core, .halo, .ring { animation: none !important; }
  }

  /* ---- header with menu ---- */
  .left { display: flex; align-items: center; gap: 10px; }
  .icon {
    width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer;
    background: transparent; border: 1px solid var(--line); border-radius: 12px; color: var(--text); padding: 0;
  }
  .icon:focus-visible, .newchat:focus-visible, .chat-row:focus-visible { outline: 2px solid var(--frost); outline-offset: 2px; }

  /* ---- chats drawer ---- */
  #drawer { position: fixed; inset: 0; z-index: 20; visibility: hidden; pointer-events: none; transition: visibility 0s .25s; }
  #drawer.open { visibility: visible; pointer-events: auto; transition-delay: 0s; }
  .scrim { position: absolute; inset: 0; background: rgba(3,5,12,.7); opacity: 0; transition: opacity .25s ease; }
  #drawer.open .scrim { opacity: 1; }
  .panel {
    position: absolute; top: 0; bottom: 0; left: 0; width: min(86vw, 340px);
    background: var(--deep); border-right: 1px solid var(--line);
    transform: translateX(-100%); transition: transform .25s ease;
    display: flex; flex-direction: column;
    padding: 14px 12px; padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: max(14px, env(safe-area-inset-bottom));
  }
  #drawer.open .panel { transform: none; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .panel-head strong { font-family: "Syne", sans-serif; font-size: 18px; }
  .newchat {
    font: inherit; font-weight: 600; color: #1a0d05; background: var(--ember);
    border: 0; border-radius: 12px; padding: 12px; cursor: pointer; margin-bottom: 12px;
  }
  #chatList { flex: 1; overflow-y: auto; }
  .chat-row {
    display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 12px; cursor: pointer;
    border: 1px solid transparent;
  }
  .chat-row.active { background: #151d38; border-color: var(--line); }
  .chat-main { flex: 1; min-width: 0; }
  .chat-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-time { font-size: 12px; color: var(--muted); }
  .chat-del { font: inherit; font-size: 13px; color: #ffb4b4; background: none; border: 0; padding: 6px; cursor: pointer; }
  .empty-note { color: var(--muted); font-size: 14px; padding: 8px 4px; }
  @media (prefers-reduced-motion: reduce) { .scrim, .panel { transition: none; } }

  /* ---- photo studio ---- */
  #studio { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; background: var(--night); }
  #studio[hidden] { display: none; }
  .st-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; padding-top: max(12px, env(safe-area-inset-top)); }
  .st-top strong { font-family: "Syne", sans-serif; font-size: 17px; }
  .chip.primary { color: #1a0d05; background: var(--ember); border: 0; font-weight: 600; }
  .st-stage { flex: 1; min-height: 120px; display: grid; place-items: center; padding: 6px 14px; overflow: hidden; background:
    conic-gradient(#0d1226 25%, #0a0f20 0 50%, #0d1226 0 75%, #0a0f20 0) 0 0 / 22px 22px; }
  #stCanvas { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; box-shadow: 0 6px 30px rgba(0,0,0,.5); }
  .st-ai { display: flex; gap: 8px; padding: 10px 14px 0; }
  .st-ai input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--deep); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
  .st-ai input::placeholder { color: #5d667f; }
  .st-ai button { font: inherit; font-weight: 600; color: #1a0d05; background: var(--ember); border: 0; border-radius: 12px; padding: 0 16px; cursor: pointer; }
  .st-ai button:disabled { opacity: .5; }
  .st-note { margin: 6px 14px 0; min-height: 20px; font-size: 13px; color: var(--muted); }
  .st-tabs { display: flex; gap: 6px; padding: 6px 14px 0; }
  .st-tabs button { flex: 1; font: inherit; font-size: 14px; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 8px 4px; cursor: pointer; }
  .st-tabs button[aria-selected="true"] { color: var(--glow); border-color: #5a3a2a; background: #1a1424; }
  .st-panel { padding: 10px 14px; min-height: 96px; max-height: 26dvh; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
  .st-panel .chip { color: var(--text); }
  .st-panel .chip[aria-pressed="true"] { color: var(--glow); border-color: #5a3a2a; }
  .st-row { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 14px; color: var(--muted); }
  .st-row span { width: 84px; flex: none; }
  .st-row input[type=range] { flex: 1; accent-color: var(--ember); }
  .st-row input[type=text], .st-panel input.txt { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--deep); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; }
  .st-bottom { display: flex; gap: 8px; padding: 8px 14px; padding-bottom: max(12px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  .st-bottom .chip { flex: 1; text-align: center; padding: 10px 6px; color: var(--text); }
  .st-bottom select { font: inherit; font-size: 13px; color: var(--text); background: var(--deep); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
  .gen-img { display: block; width: 100%; max-width: 420px; border-radius: 12px; margin-bottom: 8px; }
  .gen-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .gen-actions button { font: inherit; font-size: 13px; color: var(--text); background: #151d38; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }

  /* ---- code blocks and files in replies ---- */
  .msg.has-code { max-width: 100%; width: 100%; }
  .rt { margin: 0; }
  .rt + .code, .code + .rt, .code + .code, .code + .zipbtn { margin-top: 8px; }
  .code { background: #080c1b; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .code-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 6px 8px 6px 12px; background: #0c1226; border-bottom: 1px solid var(--line);
  }
  .fname { font-size: 13px; color: var(--glow); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .code-actions { display: flex; gap: 6px; flex: none; }
  .code-actions button, .zipbtn {
    font: inherit; font-size: 12px; color: var(--text); background: #151d38; border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 10px; cursor: pointer;
  }
  .zipbtn { display: block; color: #1a0d05; background: var(--ember); border: 0; font-weight: 600; padding: 9px 14px; border-radius: 10px; }
  .code-actions button:focus-visible, .zipbtn:focus-visible { outline: 2px solid var(--frost); outline-offset: 2px; }
  .code pre { margin: 0; padding: 10px 12px; overflow-x: auto; white-space: pre; tab-size: 2; }
  .code code, code.inline { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.55; }
  code.inline { background: #151d38; border-radius: 5px; padding: 1px 5px; color: #ffd9a0; }

  /* ---- attachments ---- */
  .bar { position: relative; align-items: center; }
  #plus {
    width: 44px; height: 44px; flex: none; display: grid; place-items: center; cursor: pointer;
    background: var(--deep); border: 1px solid var(--line); border-radius: 14px; color: var(--glow); padding: 0;
  }
  #plus:focus-visible, .menu button:focus-visible, .x:focus-visible { outline: 2px solid var(--frost); outline-offset: 2px; }
  .menu {
    position: absolute; left: 12px; bottom: calc(100% + 6px); z-index: 5;
    background: var(--deep); border: 1px solid var(--line); border-radius: 16px; padding: 6px; min-width: 220px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  .menu[hidden] { display: none; }
  .menu button {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    font: inherit; color: var(--text); background: none; border: 0; border-radius: 10px; padding: 12px; cursor: pointer;
  }
  .menu button:active { background: #151d38; }
  #tray { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 12px 0; }
  #tray:empty { display: none; }
  .att {
    position: relative; display: flex; align-items: center; gap: 8px; max-width: 70%;
    background: var(--deep); border: 1px solid var(--line); border-radius: 12px; padding: 6px 30px 6px 8px; font-size: 13px;
  }
  .att img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; display: block; }
  .att .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .x {
    position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; display: grid; place-items: center;
    background: #1c2547; color: var(--text); border: 0; border-radius: 50%; font-size: 12px; cursor: pointer; padding: 0;
  }
  .thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .thumbs img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; }
  .file-chip { display: inline-block; font-size: 13px; color: var(--glow); border: 1px solid #5a3a2a; border-radius: 999px; padding: 2px 10px; margin-bottom: 6px; }
</style>
</head>
<body>
  <header>
    <div class="left">
      <button class="icon" id="menuBtn" aria-label="Open chats">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1>Friday</h1>
    </div>
    <div class="tools">
      <button class="chip" id="voiceToggle" aria-pressed="true">Studio voice</button>
      <button class="chip" id="memBtn">Memory</button>
    </div>
  </header>

  <section class="stage">
    <button id="orb" data-state="idle" aria-label="Talk to Friday">
      <span class="halo"></span><span class="core"></span><span class="ring"></span>
    </button>
    <p id="status" role="status">Tap the orb and talk, or type below</p>
  </section>

  <section id="log" aria-live="polite"></section>

  <div id="tray" aria-label="Attachments"></div>
  <div class="bar">
    <button id="plus" aria-label="Attach" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="menu" id="menu" hidden>
      <button id="pickCamera">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        Camera
      </button>
      <button id="pickPhoto">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg>
        Photo or screenshot
      </button>
      <button id="pickEdit">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
        Edit a photo
      </button>
      <button id="pickDoc">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>
        Document
      </button>
    </div>
    <input id="input" placeholder="Ask Friday anything" autocomplete="off" enterkeyhint="send">
    <button id="send">Send</button>
  </div>
  <input type="file" id="fileEdit" accept="image/*" hidden>
  <input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
  <input type="file" id="filePhoto" accept="image/*" multiple hidden>
  <input type="file" id="fileDoc" accept=".pdf,.docx,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.xml,.yml,.yaml,.log,.java,.c,.cpp,.php,.sql,text/*" hidden>

  <div id="drawer">
    <div class="scrim" id="scrim"></div>
    <nav class="panel" aria-label="Chats">
      <div class="panel-head">
        <strong>Chats</strong>
        <button class="icon" id="drawerClose" aria-label="Close chats">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <button class="newchat" id="newChatBtn">New chat</button>
      <div id="chatList"></div>
    </nav>
  </div>

  <div id="studio" hidden role="dialog" aria-label="Photo Studio">
    <div class="st-top">
      <button class="chip" id="stClose">Close</button>
      <strong>Photo Studio</strong>
      <button class="chip primary" id="stSave">Save</button>
    </div>
    <div class="st-stage"><canvas id="stCanvas"></canvas></div>
    <div class="st-ai">
      <input id="stAsk" placeholder="Tell Friday: black and white, crop square..." autocomplete="off" enterkeyhint="go">
      <button id="stGo">Go</button>
    </div>
    <p class="st-note" id="stNote" role="status"></p>
    <div class="st-tabs" role="tablist">
      <button role="tab" data-tab="crop" aria-selected="true">Crop</button>
      <button role="tab" data-tab="filters" aria-selected="false">Filters</button>
      <button role="tab" data-tab="adjust" aria-selected="false">Adjust</button>
      <button role="tab" data-tab="text" aria-selected="false">Text</button>
    </div>
    <div class="st-panel" id="stPanel"></div>
    <div class="st-bottom">
      <button class="chip" id="stUndo">Undo</button>
      <button class="chip" id="stReset">Reset</button>
      <button class="chip" id="stSend">Ask Friday</button>
      <select id="stFormat" aria-label="Save format"><option value="jpg">JPG</option><option value="png">PNG</option><option value="webp">WEBP</option></select>
    </div>
  </div>

  <div id="memPanel" hidden>
    <div class="sheet" role="dialog" aria-label="What Friday remembers">
      <h2>What Friday remembers</h2>
      <p class="hint">Saved on this phone. Tell Friday "forget that" or remove items here.</p>
      <div id="memList"></div>
      <div class="sheet-actions">
        <button class="chip" id="memClear">Clear all</button>
        <button class="chip" id="memClose">Close</button>
      </div>
    </div>
  </div>

<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
(() => {
  const $ = (id) => document.getElementById(id);
  const orb = $("orb"), statusEl = $("status"), log = $("log"), input = $("input"), sendBtn = $("send");
  const voiceToggle = $("voiceToggle");
  const IDLE_TEXT = "Tap the orb and talk, or type below";
  const AWAY_MS = 30000; // leave the app this long, come back, and Friday opens a fresh chat
  const KEYS = { chats: "friday.chats", old: "friday.history", mem: "friday.memory", voice: "friday.voice" };

  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };

  /* ================= rich replies: code blocks and downloadable files ================= */
  const EXT = { javascript: "js", js: "js", node: "js", typescript: "ts", ts: "ts", python: "py", py: "py", html: "html", css: "css",
    json: "json", bash: "sh", sh: "sh", shell: "sh", java: "java", c: "c", cpp: "cpp", php: "php", sql: "sql", yaml: "yml", yml: "yml",
    markdown: "md", md: "md", text: "txt", txt: "txt", csv: "csv", xml: "xml", jsx: "jsx", tsx: "tsx" };

  function parseReply(text) {
    const parts = [];
    const re = /```([^\n`]*)\n([\s\S]*?)(?:```|$)/g;
    let last = 0, m, unnamed = 0;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) parts.push({ type: "text", text: text.slice(last, m.index) });
      const info = m[1].trim().split(/\s+/).filter(Boolean);
      const file = info.find((t) => /^[\w\-\/]+(\.[\w\-]+)*\.[A-Za-z0-9]+$/.test(t));
      const lang = (info.find((t) => t !== file) || "").toLowerCase();
      let name = file;
      if (!name) { unnamed++; name = "snippet" + (unnamed > 1 ? unnamed : "") + "." + (EXT[lang] || "txt"); }
      parts.push({ type: "code", name, named: !!file, code: m[2].replace(/\n$/, "") });
      last = re.lastIndex;
    }
    if (last < text.length) parts.push({ type: "text", text: text.slice(last) });
    return parts;
  }

  function saveBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name.split("/").pop();
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }
  async function copyText(t, btn) {
    try { await navigator.clipboard.writeText(t); }
    catch (e) {
      const ta = document.createElement("textarea");
      ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e2) {}
      ta.remove();
    }
    btn.textContent = "Copied";
    setTimeout(() => { btn.textContent = "Copy"; }, 1500);
  }
  function inlineText(container, text) {
    text.split(/(`[^`\n]+`)/g).forEach((piece) => {
      if (!piece) return;
      if (piece.length > 2 && piece[0] === "`" && piece[piece.length - 1] === "`") {
        const c = document.createElement("code");
        c.className = "inline";
        c.textContent = piece.slice(1, -1);
        container.appendChild(c);
      } else container.appendChild(document.createTextNode(piece));
    });
  }
  function codeBlock(p) {
    const box = document.createElement("div");
    box.className = "code";
    const head = document.createElement("div");
    head.className = "code-head";
    const nm = document.createElement("span");
    nm.className = "fname";
    nm.textContent = p.name;
    const acts = document.createElement("div");
    acts.className = "code-actions";
    const copy = document.createElement("button");
    copy.textContent = "Copy";
    copy.onclick = () => copyText(p.code, copy);
    const dl = document.createElement("button");
    dl.textContent = "Download";
    dl.onclick = () => saveBlob(new Blob([p.code], { type: "text/plain;charset=utf-8" }), p.name);
    acts.append(copy, dl);
    head.append(nm, acts);
    const pre = document.createElement("pre");
    const code = document.createElement("code");
    code.textContent = p.code;
    pre.appendChild(code);
    box.append(head, pre);
    return box;
  }
  function renderRich(container, text) {
    const parts = parseReply(text);
    const files = parts.filter((p) => p.type === "code" && p.named);
    parts.forEach((p) => {
      if (p.type === "text") {
        const t = p.text.replace(/^\n+|\n+$/g, "");
        if (!t) return;
        const d = document.createElement("div");
        d.className = "rt";
        inlineText(d, t);
        container.appendChild(d);
      } else container.appendChild(codeBlock(p));
    });
    if (parts.some((p) => p.type === "code")) container.classList.add("has-code");
    if (files.length > 1) {
      const z = document.createElement("button");
      z.className = "zipbtn";
      z.textContent = "Download all " + files.length + " files (.zip)";
      z.onclick = async () => {
        try {
          z.textContent = "Preparing zip...";
          if (!window.JSZip) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
          const zip = new window.JSZip();
          files.forEach((f) => zip.file(f.name, f.code));
          saveBlob(await zip.generateAsync({ type: "blob" }), "friday-files.zip");
        } catch (e) { z.textContent = "Couldn't make the zip. Use Download on each file."; return; }
        z.textContent = "Download all " + files.length + " files (.zip)";
      };
      container.appendChild(z);
    }
  }

  let voiceMode = load(KEYS.voice, "studio"); // "studio" = Groq voice, "phone" = this phone's voice, "off"
  if (voiceMode === true) voiceMode = "studio";
  if (voiceMode === false || !["studio", "phone", "off"].includes(voiceMode)) voiceMode = voiceMode === false ? "off" : "studio";
  let studioFailedAt = 0; // if Groq's voice fails, use the phone voice for a few minutes
  let busy = false;

  /* ================= status + messages ================= */
  function setState(s, text) {
    orb.dataset.state = s;
    const labels = { idle: IDLE_TEXT, listening: "Listening", thinking: "Thinking", speaking: "Speaking. Tap to stop" };
    statusEl.textContent = text || labels[s];
  }
  function addMsg(text, cls, m) {
    const d = document.createElement("div");
    d.className = "msg " + cls;
    if (m && ((m.images && m.images.length) || m.imgCount || m.doc)) {
      if (m.images && m.images.length) {
        const wrap = document.createElement("div");
        wrap.className = "thumbs";
        m.images.forEach((u) => { const im = document.createElement("img"); im.src = u; im.alt = "Attached photo"; wrap.appendChild(im); });
        d.appendChild(wrap);
      } else if (m.imgCount) {
        const c = document.createElement("div");
        c.className = "file-chip";
        c.textContent = m.imgCount > 1 ? m.imgCount + " photos" : "Photo";
        d.appendChild(c);
      }
      if (m.doc) {
        const c = document.createElement("div");
        c.className = "file-chip";
        c.textContent = m.doc.name;
        d.appendChild(c);
        d.appendChild(document.createElement("br"));
      }
    }
    if (cls.indexOf("bot") >= 0 && cls.indexOf("pending") < 0 && cls.indexOf("error") < 0) renderRich(d, text);
    else d.appendChild(document.createTextNode(text));
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  /* ================= chats (history drawer) ================= */
  let chats = load(KEYS.chats, []);
  // bring over the single chat saved by the earlier version
  const oldHistory = load(KEYS.old, null);
  if (oldHistory && oldHistory.length && !chats.length) {
    const first = oldHistory.find((m) => m.role === "user");
    chats = [{ id: "legacy", title: first ? first.content.slice(0, 40) : "Earlier chat", updated: Date.now(), messages: oldHistory }];
    store(KEYS.chats, chats);
  }
  try { localStorage.removeItem(KEYS.old); } catch (e) {}

  const newChat = () => ({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: "", updated: Date.now(), messages: [] });
  let current = newChat(); // every launch starts a fresh chat

  function persist() {
    if (!current.messages.length) return;
    const i = chats.findIndex((c) => c.id === current.id);
    if (i >= 0) chats[i] = current; else chats.unshift(current);
    chats = chats.sort((a, b) => b.updated - a.updated).slice(0, 50);
    const slim = (keepDocs) => chats.map((c) => ({
      ...c,
      messages: c.messages.slice(-60).map((m) => {
        const { images, ...rest } = m; // photos stay in memory only
        if (rest.doc && !(keepDocs || c.id === current.id)) rest.doc = { name: rest.doc.name, text: "" };
        return rest;
      })
    }));
    if (!store(KEYS.chats, slim(true))) {
      if (!store(KEYS.chats, slim(false))) {
        chats = chats.slice(0, 15);
        store(KEYS.chats, slim(false));
      }
    }
  }
  function renderChat() {
    log.innerHTML = "";
    current.messages.forEach((m) => addMsg(m.content, m.role === "user" ? "user" : "bot", m));
  }
  function startNew() {
    stopSpeaking();
    if (current.messages.length) current = newChat();
    renderChat();
    input.value = "";
    setState("idle");
  }
  function openChat(id) {
    const c = chats.find((x) => x.id === id);
    if (!c) return;
    stopSpeaking();
    current = c;
    renderChat();
    setState("idle");
    closeDrawer();
  }
  function renderList() {
    const list = $("chatList");
    list.innerHTML = "";
    const sorted = chats.slice().sort((a, b) => b.updated - a.updated);
    if (!sorted.length) {
      const p = document.createElement("p");
      p.className = "empty-note";
      p.textContent = "Your past chats will show up here.";
      list.appendChild(p);
      return;
    }
    sorted.forEach((c) => {
      const row = document.createElement("div");
      row.className = "chat-row" + (c.id === current.id ? " active" : "");
      row.tabIndex = 0;
      row.setAttribute("role", "button");
      const main = document.createElement("div");
      main.className = "chat-main";
      const t = document.createElement("div");
      t.className = "chat-title";
      t.textContent = c.title || "Chat";
      const when = document.createElement("div");
      when.className = "chat-time";
      when.textContent = new Date(c.updated).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      main.append(t, when);
      const del = document.createElement("button");
      del.className = "chat-del";
      del.textContent = "Delete";
      del.onclick = (e) => {
        e.stopPropagation();
        chats = chats.filter((x) => x.id !== c.id);
        store(KEYS.chats, chats);
        if (c.id === current.id) { current = newChat(); renderChat(); }
        renderList();
      };
      row.append(main, del);
      row.onclick = () => openChat(c.id);
      row.onkeydown = (e) => { if (e.key === "Enter") openChat(c.id); };
      list.appendChild(row);
    });
  }
  function openDrawer() { renderList(); $("drawer").classList.add("open"); }
  function closeDrawer() { $("drawer").classList.remove("open"); }
  $("menuBtn").onclick = openDrawer;
  $("drawerClose").onclick = closeDrawer;
  $("scrim").onclick = closeDrawer;
  $("newChatBtn").onclick = () => { startNew(); closeDrawer(); };

  // a short summary of earlier chats, so Friday can pick up where you left off
  function recentContext() {
    return chats
      .filter((c) => c.id !== current.id && c.messages.length)
      .sort((a, b) => b.updated - a.updated)
      .slice(0, 5)
      .map((c) => {
        const users = c.messages.filter((m) => m.role === "user");
        const bots = c.messages.filter((m) => m.role === "assistant");
        return {
          title: c.title,
          user: users.length ? users[users.length - 1].content : "",
          reply: bots.length ? bots[bots.length - 1].content : ""
        };
      });
  }

  /* ================= memory ================= */
  let memory = load(KEYS.mem, []);
  const memBtn = $("memBtn"), memPanel = $("memPanel"), memList = $("memList");
  function renderMem() {
    memBtn.textContent = memory.length ? "Memory (" + memory.length + ")" : "Memory";
    memList.innerHTML = "";
    if (!memory.length) {
      const p = document.createElement("p");
      p.className = "hint";
      p.textContent = "Nothing yet. Tell Friday about yourself and she'll start remembering.";
      memList.appendChild(p);
      return;
    }
    memory.forEach((f, i) => {
      const row = document.createElement("div");
      row.className = "fact";
      const t = document.createElement("span");
      t.textContent = f;
      const b = document.createElement("button");
      b.textContent = "Remove";
      b.onclick = () => { memory.splice(i, 1); store(KEYS.mem, memory); renderMem(); };
      row.append(t, b);
      memList.appendChild(row);
    });
  }
  async function remember(text) {
    try {
      const r = await fetch("/remember", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, memory })
      });
      const d = await r.json();
      if (Array.isArray(d.memory)) { memory = d.memory; store(KEYS.mem, memory); renderMem(); }
    } catch (e) {}
  }
  memBtn.onclick = () => { renderMem(); memPanel.hidden = false; };
  $("memClose").onclick = () => { memPanel.hidden = true; };
  memPanel.addEventListener("click", (e) => { if (e.target === memPanel) memPanel.hidden = true; });
  $("memClear").onclick = () => {
    if (confirm("Erase everything Friday remembers about you?")) { memory = []; store(KEYS.mem, memory); renderMem(); }
  };
  renderMem();

  /* ================= voice out ================= */
  const player = new Audio();
  player.preservesPitch = false;
  player.mozPreservesPitch = false;
  player.webkitPreservesPitch = false;
  const VOICE_RATE = 0.94; // slightly slower with pitch lowered = deeper voice
  let speakToken = 0;

  function prepareSpeech(text) {
    return text
      .replace(/```[\s\S]*?```/g, " I've put the code on screen. ")
      .replace(/https?:\/\/\S+/g, " link ")
      .replace(/[*_`#>~]/g, "")
      .replace(/\s+/g, " ")
      .trim()
      .slice(0, 700);
  }
  function chunkSpeech(text) {
    const sentences = text.match(/[^.!?\n]+[.!?]*\s*/g) || [text];
    const chunks = [];
    let cur = "";
    const push = () => { if (cur.trim()) chunks.push(cur.trim()); cur = ""; };
    sentences.forEach((s) => {
      while (s.length > 180) {
        let cut = s.lastIndexOf(" ", 180);
        if (cut < 60) cut = 180;
        if ((cur + s.slice(0, cut)).length > 180) push();
        cur += s.slice(0, cut) + " ";
        push();
        s = s.slice(cut);
      }
      if ((cur + s).length > 180) push();
      cur += s;
    });
    push();
    return chunks;
  }
  const fetchAudio = (text) =>
    fetch("/speak", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) })
      .then(async (r) => {
        if (!r.ok) {
          let raw = "";
          try { raw = (await r.json()).error || ""; } catch (e) {}
          const m = raw.match(/"message"\s*:\s*"([^"]*)/);
          throw new Error((m ? m[1] : raw || "server error " + r.status).slice(0, 110));
        }
        return r.blob();
      });

  function playBlob(blob, token, onStart) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      const done = () => URL.revokeObjectURL(url);
      player.onended = () => { done(); resolve(); };
      player.onerror = () => { done(); reject(new Error("play")); };
      player.src = url;
      player.defaultPlaybackRate = VOICE_RATE;
      player.playbackRate = VOICE_RATE;
      player.play().then(() => { if (onStart) onStart(); if (token === speakToken) setState("speaking"); }).catch((e) => { done(); reject(e); });
    });
  }

  // the phone's own voice: picks the deepest male-sounding English voice it can find
  function browserSpeak(text, note) {
    if (!("speechSynthesis" in window)) { setState("idle", "This browser has no voice to speak with."); return; }
    const go = () => {
      const voices = speechSynthesis.getVoices().filter((v) => /^en/i.test(v.lang));
      const male = voices.find((v) => /male|david|mark|daniel|james|guy|ryan|alex|fred|x-iom|x-tpd|x-rjs/i.test(v.name) && !/female/i.test(v.name));
      const u = new SpeechSynthesisUtterance(text);
      if (male || voices[0]) u.voice = male || voices[0];
      u.pitch = 0.6;
      u.rate = 0.95;
      u.onstart = () => setState("speaking", note ? note + " Tap to stop." : undefined);
      u.onend = () => setState("idle");
      u.onerror = (e) => setState("idle", "Phone voice problem: " + ((e && e.error) || "unknown") + ". Check your media volume.");
      try { speechSynthesis.resume(); } catch (e) {}
      speechSynthesis.speak(u);
    };
    if (speechSynthesis.getVoices().length) return go();
    let done = false;
    const fin = () => { if (!done) { done = true; go(); } };
    speechSynthesis.onvoiceschanged = fin;
    setTimeout(fin, 800);
  }

  async function speak(raw) {
    if (voiceMode === "off") { setState("idle"); return; }
    stopSpeaking(true);
    const token = ++speakToken;
    const text = prepareSpeech(raw);
    const chunks = chunkSpeech(text);
    if (!chunks.length) { setState("idle"); return; }
    if (voiceMode === "phone") { browserSpeak(text); return; }
    if (Date.now() - studioFailedAt < 300000) { browserSpeak(text, "Studio voice is unavailable, using the phone voice."); return; }
    let started = false; // has any studio audio actually begun playing?
    let next = fetchAudio(chunks[0]);
    next.catch(() => {});
    try {
      for (let i = 0; i < chunks.length; i++) {
        const blob = await next;
        if (token !== speakToken) return;
        if (i + 1 < chunks.length) { next = fetchAudio(chunks[i + 1]); next.catch(() => {}); }
        await playBlob(blob, token, () => { started = true; });
        if (token !== speakToken) return;
      }
      setState("idle");
    } catch (e) {
      if (token !== speakToken) return;
      if (!started) {
        studioFailedAt = Date.now();
        const why = (e && e.message) || "";
        const note = /terms/i.test(why)
          ? "Studio voice needs its terms accepted in Groq. Using the phone voice."
          : /rate|limit|quota/i.test(why)
            ? "Studio voice hit its limit. Using the phone voice."
            : "Studio voice is unavailable (" + why.slice(0, 50) + "). Using the phone voice.";
        browserSpeak(text, note);
      } else setState("idle");
    }
  }
  function stopSpeaking(silent) {
    speakToken++;
    try { player.pause(); } catch (e) {}
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    if (!silent) setState("idle");
  }

  /* ================= attachments ================= */
  const MAX_IMAGES = 3, MAX_DOC_CHARS = 12000;
  let pending = { images: [], doc: null };
  const tray = $("tray"), menu = $("menu"), plus = $("plus");

  function renderTray() {
    tray.innerHTML = "";
    const mk = (label, thumb, onRemove) => {
      const a = document.createElement("div");
      a.className = "att";
      if (thumb) { const im = document.createElement("img"); im.src = thumb; im.alt = ""; a.appendChild(im); }
      const n = document.createElement("span");
      n.className = "nm";
      n.textContent = label;
      const x = document.createElement("button");
      x.className = "x";
      x.setAttribute("aria-label", "Remove " + label);
      x.textContent = "\u2715";
      x.onclick = onRemove;
      a.append(n, x);
      tray.appendChild(a);
    };
    pending.images.forEach((im, i) => mk(im.name, im.dataUrl, () => { pending.images.splice(i, 1); renderTray(); }));
    if (pending.doc) mk(pending.doc.name, null, () => { pending.doc = null; renderTray(); });
  }
  function toggleMenu(show) {
    menu.hidden = !show;
    plus.setAttribute("aria-expanded", String(show));
  }
  plus.onclick = (e) => { e.stopPropagation(); toggleMenu(menu.hidden); };
  document.addEventListener("click", (e) => { if (!menu.hidden && !menu.contains(e.target)) toggleMenu(false); });
  $("pickCamera").onclick = () => { toggleMenu(false); $("fileCamera").click(); };
  $("pickPhoto").onclick = () => { toggleMenu(false); $("filePhoto").click(); };
  $("pickDoc").onclick = () => { toggleMenu(false); $("fileDoc").click(); };

  function shrinkImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const max = 1280;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Couldn't open that image.")); };
      img.src = url;
    });
  }
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src; s.onload = resolve; s.onerror = () => reject(new Error("Couldn't load the document reader. Check your connection."));
      document.head.appendChild(s);
    });
  }
  async function readPdf(file) {
    if (!window.pdfjsLib) {
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }
    const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    let text = "";
    for (let p = 1; p <= pdf.numPages && text.length < MAX_DOC_CHARS; p++) {
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      text += content.items.map((i) => i.str).join(" ") + "\n\n";
    }
    return text;
  }
  async function readDocx(file) {
    if (!window.mammoth) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
    const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return r.value;
  }
  async function readDoc(file) {
    const name = file.name || "document";
    const lower = name.toLowerCase();
    let text;
    if (lower.endsWith(".pdf") || file.type === "application/pdf") text = await readPdf(file);
    else if (lower.endsWith(".docx")) text = await readDocx(file);
    else if (/\.(xlsx|xls|pptx|ppt|doc|zip|rar|apk|exe)$/.test(lower)) throw new Error("That file type isn't supported yet. Use PDF, Word (.docx), or a text file.");
    else text = await file.text();
    text = (text || "").replace(/\u0000/g, "").trim();
    if (!text) throw new Error("I couldn't find any text in that file. If it's a scan, send the pages as photos instead.");
    let truncated = false;
    if (text.length > MAX_DOC_CHARS) { text = text.slice(0, MAX_DOC_CHARS); truncated = true; }
    return { name, text: truncated ? text + "\n[...document continues, only the first part was sent]" : text, truncated };
  }

  async function addImages(fileList) {
    for (const f of Array.from(fileList)) {
      if (pending.images.length >= MAX_IMAGES) { setState("idle", "Up to " + MAX_IMAGES + " photos at a time."); break; }
      try {
        setState("idle", "Preparing photo...");
        pending.images.push({ name: f.name || "Photo", dataUrl: await shrinkImage(f) });
        setState("idle");
      } catch (e) { setState("idle", e.message); }
    }
    renderTray();
  }
  async function addDoc(f) {

  // what the server needs: photos only on the newest photo message, documents on the last two
  function apiMessages() {

  /* ================= photo studio ================= */
  const FILTERS = {
    bw: "grayscale(1) contrast(1.1)",
    sepia: "sepia(0.9)",
    vintage: "sepia(0.45) contrast(0.95) saturate(0.85) brightness(1.05)",
    warm: "sepia(0.25) saturate(1.25) hue-rotate(-12deg) brightness(1.03)",
    cool: "saturate(1.05) hue-rotate(12deg) brightness(1.02) contrast(1.03)",
    vivid: "saturate(1.6) contrast(1.12)",
    fade: "contrast(0.82) brightness(1.12) saturate(0.8)",
    dramatic: "contrast(1.35) saturate(1.15) brightness(0.92)",
    invert: "invert(1)"
  };
  const FILTER_LABELS = { bw: "Black & white", sepia: "Sepia", vintage: "Vintage", warm: "Warm", cool: "Cool", vivid: "Vivid", fade: "Fade", dramatic: "Dramatic", invert: "Invert" };
  const RATIOS = { "1:1": [1, 1], "4:5": [4, 5], "5:4": [5, 4], "3:2": [3, 2], "2:3": [2, 3], "4:3": [4, 3], "3:4": [3, 4], "16:9": [16, 9], "9:16": [9, 16] };
  const newCanvas = (w, h) => { const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, Number(v)));
  const freshState = () => ({ geo: [], filter: null, adjust: { brightness: 0, contrast: 0, saturation: 0, hue: 0, blur: 0 }, deco: [] });

  function applyGeo(src, op) {
    const w = src.width, h = src.height;
    if (op.op === "rotate") {
      const d = ((op.degrees % 360) + 360) % 360;
      if (!d) return src;
      const swap = d === 90 || d === 270;
      const c = newCanvas(swap ? h : w, swap ? w : h);
      const x = c.getContext("2d");
      x.translate(c.width / 2, c.height / 2);
      x.rotate(d * Math.PI / 180);
      x.drawImage(src, -w / 2, -h / 2);
      return c;
    }
    if (op.op === "flip") {
      const c = newCanvas(w, h), x = c.getContext("2d");
      if (op.axis === "v") { x.translate(0, h); x.scale(1, -1); } else { x.translate(w, 0); x.scale(-1, 1); }
      x.drawImage(src, 0, 0);
      return c;
    }
    if (op.op === "crop") {
      let sx, sy, sw, sh;
      if (op.ratio && RATIOS[op.ratio]) {
        const t = RATIOS[op.ratio][0] / RATIOS[op.ratio][1];
        if (w / h > t) { sh = h; sw = h * t; } else { sw = w; sh = w / t; }
        sx = (w - sw) / 2; sy = (h - sh) / 2;
      } else if ([op.x, op.y, op.w, op.h].every((n) => typeof n === "number")) {
        sx = op.x * w; sy = op.y * h; sw = op.w * w; sh = op.h * h;
      } else return src;
      const c = newCanvas(sw, sh);
      c.getContext("2d").drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
      return c;
    }
    if (op.op === "resize") {
      const m = Math.max(w, h);
      if (!op.maxSize || m <= op.maxSize) return src;
      const k = op.maxSize / m, c = newCanvas(w * k, h * k);
      c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
      return c;
    }
    return src;
  }
  function filterString(st, width) {
    const a = st.adjust, parts = [];
    if (st.filter && FILTERS[st.filter]) parts.push(FILTERS[st.filter]);
    if (a.brightness) parts.push("brightness(" + (1 + a.brightness / 100) + ")");
    if (a.contrast) parts.push("contrast(" + (1 + a.contrast / 100) + ")");
    if (a.saturation) parts.push("saturate(" + (1 + a.saturation / 100) + ")");
    if (a.hue) parts.push("hue-rotate(" + a.hue + "deg)");
    if (a.blur) parts.push("blur(" + (a.blur * Math.max(1, width / 800)).toFixed(2) + "px)");
    return parts.join(" ");
  }
  function drawText(c, op) {
    const x = c.getContext("2d");
    const size = Math.max(10, (op.size || 8) / 100 * c.width);
    x.font = "800 " + size + "px 'Instrument Sans', system-ui, sans-serif";
    x.textAlign = "center";
    x.textBaseline = "middle";
    const maxW = c.width * 0.9, lines = [];
    let line = "";
    String(op.text).split(/\s+/).forEach((w) => {
      const t = line ? line + " " + w : w;
      if (x.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
    });
    if (line) lines.push(line);
    const lh = size * 1.2, total = lh * lines.length;
    const cy = op.position === "top" ? size * 0.8 + total / 2 : op.position === "center" ? c.height / 2 : c.height - size * 0.8 - total / 2;
    x.lineJoin = "round";
    x.lineWidth = size * 0.14;
    x.strokeStyle = "rgba(0,0,0,.75)";
    x.fillStyle = op.color || "#ffffff";
    lines.forEach((l, i) => {
      const y = cy - total / 2 + lh * (i + 0.5);
      if (op.stroke !== false) x.strokeText(l, c.width / 2, y);
      x.fillText(l, c.width / 2, y);
    });
  }
  function renderState(base, st) {
    let c = base;
    st.geo.forEach((op) => { c = applyGeo(c, op); });
    const f = filterString(st, c.width);
    const n = newCanvas(c.width, c.height); // always work on a copy, never the original
    const nx = n.getContext("2d");
    if (f) nx.filter = f;
    nx.drawImage(c, 0, 0);
    c = n;
    st.deco.forEach((op) => {
      if (op.op === "text") drawText(c, op);
      else if (op.op === "border") {
        const b = Math.round(Math.min(c.width, c.height) * clamp(op.width || 4, 1, 12) / 100);
        const nb = newCanvas(c.width + b * 2, c.height + b * 2), x = nb.getContext("2d");
        x.fillStyle = op.color || "#ffffff";
        x.fillRect(0, 0, nb.width, nb.height);
        x.drawImage(c, b, b);
        c = nb;
      } else if (op.op === "round") {
        const r = Math.min(c.width, c.height) * clamp(op.radius == null ? 50 : op.radius, 0, 50) / 100;
        const nr = newCanvas(c.width, c.height), x = nr.getContext("2d");
        x.beginPath();
        if (x.roundRect) x.roundRect(0, 0, c.width, c.height, r);
        else x.rect(0, 0, c.width, c.height);
        x.clip();
        x.drawImage(c, 0, 0);
        c = nr;
      }
    });
    return c;
  }
  function applyPlan(st, ops) {
    let did = 0;
    ops.forEach((o) => {
      if (!o || !o.op) return;
      if (["rotate", "flip", "crop", "resize"].includes(o.op)) { st.geo.push(o); did++; }
      else if (o.op === "filter") { st.filter = o.name === "none" || !FILTERS[o.name] ? null : o.name; did++; }
      else if (o.op === "adjust") {
        ["brightness", "contrast", "saturation"].forEach((k) => { if (typeof o[k] === "number") st.adjust[k] = clamp(st.adjust[k] + o[k], -100, 100); });
        if (typeof o.hue === "number") st.adjust.hue = clamp(st.adjust.hue + o.hue, -180, 180);
        if (typeof o.blur === "number") st.adjust.blur = clamp(o.blur, 0, 20);
        did++;
      } else if (["text", "border", "round"].includes(o.op)) { st.deco.push(o); did++; }
    });
    return did;
  }

  /* ---- studio screen ---- */
  const studio = $("studio"), stCanvas = $("stCanvas"), stNote = $("stNote"), stPanel = $("stPanel");
  let stFull = null, stPrev = null, stState = freshState(), stHist = [], stTab = "crop";

  function stDraw() {
    if (!stPrev) return;
    const out = renderState(stPrev, stState);
    stCanvas.width = out.width;
    stCanvas.height = out.height;
    stCanvas.getContext("2d").drawImage(out, 0, 0);
  }
  function stPush() { stHist.push(JSON.stringify(stState)); if (stHist.length > 40) stHist.shift(); }
  function stDo(fn) { stPush(); fn(); stDraw(); stBuild(); }
  function fitInto(src, max) {
    const k = Math.min(1, max / Math.max(src.width, src.height));
    const c = newCanvas(src.width * k, src.height * k);
    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
    return c;
  }
  function openStudio(source, ask) {
    const img = new Image();
    img.onload = () => {
      stFull = fitInto(img, 2400);
      stPrev = fitInto(img, 1000);
      stState = freshState();
      stHist = [];
      stNote.textContent = "";
      $("stAsk").value = "";
      studio.hidden = false;
      stTab = "crop";
      stBuild();
      stDraw();
      if (ask) { $("stAsk").value = ask; stAskFriday(); }
    };
    img.onerror = () => setState("idle", "Couldn't open that image.");
    img.src = typeof source === "string" ? source : URL.createObjectURL(source);
  }
  async function stAskFriday() {
    const q = $("stAsk").value.trim();
    if (!q) return;
    $("stGo").disabled = true;
    stNote.textContent = "Friday is working on it...";
    try {
      const r = await fetch("/edit-plan", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ instruction: q }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "Failed");
      if (!d.ops || !d.ops.length) { stNote.textContent = d.note || "I couldn't turn that into an edit. Try the tools below."; }
      else {
        stPush();
        applyPlan(stState, d.ops);
        stDraw();
        stBuild();
        stNote.textContent = d.note || "Done.";
        $("stAsk").value = "";
      }
    } catch (e) { stNote.textContent = (e && e.message) || "Couldn't reach Friday."; }
    $("stGo").disabled = false;
  }
  function chipBtn(label, onClick, pressed) {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = label;

  }
  function slider(label, key, min, max) {
    const row = document.createElement("div");
    row.className = "st-row";
    const s = document.createElement("span");
    s.textContent = label;
    const r = document.createElement("input");
    r.type = "range"; r.min = min; r.max = max; r.value = stState.adjust[key];
    r.setAttribute("aria-label", label);
    let queued = false;
    const begin = () => stPush();
    r.addEventListener("pointerdown", begin);
    r.addEventListener("touchstart", begin, { passive: true });
    r.addEventListener("input", () => {
      stState.adjust[key] = Number(r.value);
      if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; stDraw(); }); }
    });
    row.append(s, r);
    return row;
  }
  function stBuild() {
    stPanel.innerHTML = "";
    studio.querySelectorAll(".st-tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === stTab)));
    if (stTab === "crop") {
      stPanel.append(
        chipBtn("Rotate left", () => stDo(() => stState.geo.push({ op: "rotate", degrees: 270 }))),
        chipBtn("Rotate right", () => stDo(() => stState.geo.push({ op: "rotate", degrees: 90 }))),
        chipBtn("Flip", () => stDo(() => stState.geo.push({ op: "flip", axis: "h" }))),
        chipBtn("Flip up/down", () => stDo(() => stState.geo.push({ op: "flip", axis: "v" })))
      );
      ["1:1", "4:5", "16:9", "9:16", "3:2"].forEach((r) => stPanel.append(chipBtn("Crop " + r, () => stDo(() => stState.geo.push({ op: "crop", ratio: r })))));
      stPanel.append(
        chipBtn("Circle", () => stDo(() => stState.deco.push({ op: "round", radius: 50 }))),
        chipBtn("Rounded corners", () => stDo(() => stState.deco.push({ op: "round", radius: 12 }))),
        chipBtn("White border", () => stDo(() => stState.deco.push({ op: "border", width: 4, color: "#ffffff" })))
      );
    } else if (stTab === "filters") {
      stPanel.append(chipBtn("Original", () => stDo(() => { stState.filter = null; }), !stState.filter));
      Object.keys(FILTERS).forEach((k) => stPanel.append(chipBtn(FILTER_LABELS[k], () => stDo(() => { stState.filter = k; }), stState.filter === k)));
    } else if (stTab === "adjust") {
      stPanel.append(slider("Brightness", "brightness", -100, 100), slider("Contrast", "contrast", -100, 100), slider("Colour", "saturation", -100, 100), slider("Blur", "blur", 0, 20));
    } else if (stTab === "text") {

      t.className = "txt"; t.type = "text"; t.placeholder = "Type your caption"; t.maxLength = 80;
      t.style.width = "100%";
      let pos = "bottom", color = "#ffffff", size = 8;
      const posRow = document.createElement("div");

      const sp = document.createElement("span"); sp.textContent = "Position";

      sel.onchange = () => { pos = sel.value; };

      sr.oninput = () => { size = Number(sr.value); };
      sizeRow.append(ss, sr);

      colors.className = "st-row";
      const cs = document.createElement("span"); cs.textContent = "Colour";
      colors.appendChild(cs);
      [["White", "#ffffff"], ["Black", "#000000"], ["Yellow", "#ffd400"], ["Orange", "#ff8a3d"]].forEach(([l, v]) => {
        const b = chipBtn(l, () => { color = v; colors.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); }, v === color);
        colors.appendChild(b);
      });
      stPanel.append(t, posRow, sizeRow, colors, chipBtn("Add text", () => {
        const v = t.value.trim();
        if (!v) { stNote.textContent = "Type some text first."; return; }

      }));
    }
  }
  studio.querySelectorAll(".st-tabs button").forEach((b) => { b.onclick = () => { stTab = b.dataset.tab; stBuild(); }; });
  $("stClose").onclick = () => { studio.hidden = true; stFull = stPrev = null; };
  $("stGo").onclick = stAskFriday;
  $("stAsk").addEventListener("keydown", (e) => { if (e.key === "Enter") stAskFriday(); });
  $("stUndo").onclick = () => {
    if (!stHist.length) { stNote.textContent = "Nothing to undo."; return; }
    stState = JSON.parse(stHist.pop());
    stDraw(); stBuild(); stNote.textContent = "";
  };
  $("stReset").onclick = () => { stPush(); stState = freshState(); stDraw(); stBuild(); stNote.textContent = "Back to the original."; };
  function stExport(type, quality) {
    return new Promise((resolve) => renderState(stFull, stState).toBlob(resolve, type, quality));
  }
  $("stSave").onclick = async () => {
    if (!stFull) return;

  };
  $("stSend").onclick = () => {

    const out = fitInto(renderState(stFull, stState), 1280);

  $("pickEdit").onclick = () => { toggleMenu(false); $("fileEdit").click(); };
  $("fileEdit").onchange = (e) => { const f = e.target.files[0]; e.target.value = ""; if (f) openStudio(f); };

  /* ================= drawing pictures from a description ================= */
  const DRAW_RE = /^\s*(?:\/(?:image|draw|imagine)\b|(?:please\s+|can you\s+|could you\s+)?(?:(?:draw|paint|illustrate|imagine)\s+(?:me\s+|us\s+)?(?:an?\s+|the\s+|some\s+|my\s+)(?!(?:conclusion|comparison|line|table|diagram|flowchart|chart|graph|parallel|plan)\b)|(?:draw|paint|illustrate)\s+me\s+|(?:generate|create|make|design)\s+(?:me\s+)?(?:an?\s+|the\s+|some\s+)?(?:image|picture|photo|logo|wallpaper|poster|art|artwork|illustration|drawing|painting|portrait|icon|banner|cartoon|avatar)\b))/i;
  const EDIT_RE = /\b(edit|crop|rotate|flip|mirror|filter|black and white|grayscale|greyscale|sepia|brighten|darken|brighter|darker|blur|resize|compress|caption|watermark|add text|enhance|retouch|vintage|sharpen)\b/i;

  function aspectFor(p) {
    if (/\b(wallpaper|portrait|phone|story|vertical|poster)\b/i.test(p)) return [768, 1344];
    if (/\b(banner|landscape|wide|youtube|thumbnail|desktop|cover)\b/i.test(p)) return [1344, 768];
    return [1024, 1024];
  }
  async function drawImage(text) {
    busy = true; sendBtn.disabled = true;
    stopSpeaking(true);
    const userMsg = { role: "user", content: text };
    addMsg(text, "user", userMsg);
    current.messages.push(userMsg);
    if (!current.title) current.title = text.slice(0, 40);
    current.updated = Date.now();
    const prompt = text.replace(/^\s*\/(?:image|draw|imagine)\b\s*/i, "").trim() || text;
    const bubble = addMsg("Painting that for you...", "bot pending");
    setState("thinking", "Painting your picture. This can take up to a minute.");
    const make = async () => {
      const [w, hgt] = aspectFor(prompt);
      const url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt) +
        "?width=" + w + "&height=" + hgt + "&nologo=true&model=flux&seed=" + Math.floor(Math.random() * 1e9);
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 90000);
      try {
        const r = await fetch(url, { signal: ctl.signal });
        if (!r.ok) throw new Error("The picture service answered with " + r.status + ".");
        const blob = await r.blob();
        if (!blob.type.startsWith("image/")) throw new Error("The picture service didn't return an image.");
        return blob;
      } finally { clearTimeout(timer); }
    };
    const show = (blob) => {
      bubble.className = "msg bot";
      bubble.textContent = "";
      const objUrl = URL.createObjectURL(blob);
      const im = document.createElement("img");
      im.className = "gen-img";
      im.alt = prompt.slice(0, 120);
      im.src = objUrl;
      const acts = document.createElement("div");
      acts.className = "gen-actions";
      const mk = (label, fn) => { const b = document.createElement("button"); b.textContent = label; b.onclick = fn; return b; };
      acts.append(
        mk("Download", () => saveBlob(blob, "friday-image.jpg")),
        mk("Edit", () => openStudio(objUrl)),
        mk("Redraw", async () => {
          acts.querySelectorAll("button").forEach((b) => { b.disabled = true; });
          try { bubble.textContent = ""; bubble.className = "msg bot pending"; bubble.textContent = "Painting again..."; show(await make()); }
          catch (e) { bubble.className = "msg bot error"; bubble.textContent = "Couldn't redraw. " + e.message; }
        })
      );
      bubble.append(im, acts);
      log.scrollTop = log.scrollHeight;
    };
    try {
      show(await make());
      current.messages.push({ role: "assistant", content: "(Drew a picture: " + prompt.slice(0, 120) + ")" });
      current.updated = Date.now();
      persist();
      setState("idle");
    } catch (e) {
      bubble.className = "msg bot error";
      const why = e && e.name === "AbortError" ? "It took too long." : (e && e.message) || "";
      bubble.textContent = "Couldn't draw that right now. " + why + " The free picture service can be busy, so try again in a minute.";
      current.messages.pop();
      setState("idle");
    } finally {
      busy = false; sendBtn.disabled = false;
    }
  }

  /* ================= chat ================= */
  async function send(text) {
    text = (text || "").trim();
    const hasAtt = pending.images.length > 0 || !!pending.doc;
    if ((!text && !hasAtt) || busy) return;
    const typed = !!text;
    if (!text) text = pending.images.length ? "What's in this?" : "Summarize this document for me.";
    if (typed && pending.images.length && !pending.doc && EDIT_RE.test(text)) {
      const first = pending.images[0].dataUrl;
      pending = { images: [], doc: null };
      renderTray();
      input.value = "";
      openStudio(first, text);
      return;
    }
    if (typed && !hasAtt && DRAW_RE.test(text)) { input.value = ""; drawImage(text); return; }
    busy = true; sendBtn.disabled = true;
    input.value = "";
    stopSpeaking(true);
    const msg = { role: "user", content: text };
    if (pending.images.length) { msg.images = pending.images.map((i) => i.dataUrl); msg.imgCount = msg.images.length; }
    if (pending.doc) msg.doc = { name: pending.doc.name, text: pending.doc.text };
    pending = { images: [], doc: null };
    renderTray();
    addMsg(text, "user", msg);
    current.messages.push(msg);
    if (!current.title) current.title = text.slice(0, 40);
    current.updated = Date.now();
    const bubble = addMsg("...", "bot pending");
    setState("thinking");
    try {
      const r = await fetch("/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: apiMessages(), memory, recent: recentContext() })
      });
      const data = await r.json();
      if (!r.ok || !data.reply) throw new Error(data.error || "No response");
      bubble.className = "msg bot";
      bubble.textContent = "";
      renderRich(bubble, data.reply);
      current.messages.push({ role: "assistant", content: data.reply });
      current.updated = Date.now();
      persist();
      speak(data.reply);
      remember(text);
    } catch (e) {
      bubble.className = "msg bot error";
      bubble.textContent = "Friday couldn't answer. " + (e && e.message ? e.message : "");
      current.messages.pop();
      setState("idle");
    } finally {
      busy = false; sendBtn.disabled = false;
      log.scrollTop = log.scrollHeight;
    }
  }

  /* ================= voice in ================= */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, finalText = "";
  if (SR) {
    rec = new SR();
    rec.lang = navigator.language || "en-US";
    rec.interimResults = true;
    rec.continuous = false;
    rec.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += t; else interim += t;
      }
      input.value = finalText + interim;
    };
    rec.onend = () => {
      listening = false;
      if (finalText.trim()) send(finalText); else setState("idle");
      finalText = "";
    };
    rec.onerror = (e) => {
      listening = false; finalText = "";
      setState("idle", e.error === "not-allowed" ? "Microphone blocked. Allow mic access in your browser settings." : "Didn't catch that. Tap the orb and try again.");
    };
  }
  orb.addEventListener("click", () => {
    if (orb.dataset.state === "speaking") { stopSpeaking(); return; }
    if (!rec) { setState("idle", "Voice input isn't supported in this browser. Try Chrome."); return; }
    if (listening) { rec.stop(); return; }
    finalText = ""; input.value = "";
    try { rec.start(); listening = true; setState("listening"); } catch (e) {}
  });

  /* ================= controls ================= */
  sendBtn.addEventListener("click", () => send(input.value));
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(input.value); });
  const VOICE_LABEL = { studio: "Studio voice", phone: "Phone voice", off: "Voice off" };
  function paintVoice() {
    voiceToggle.setAttribute("aria-pressed", String(voiceMode !== "off"));
    voiceToggle.textContent = VOICE_LABEL[voiceMode];
  }
  voiceToggle.addEventListener("click", () => {
    voiceMode = voiceMode === "studio" ? "phone" : voiceMode === "phone" ? "off" : "studio";
    if (voiceMode === "studio") studioFailedAt = 0;
    store(KEYS.voice, voiceMode);
    paintVoice();
    stopSpeaking(true);
    setState("idle", voiceMode === "off" ? "Voice is off." : voiceMode === "phone" ? "Using this phone's voice." : "Using the studio voice.");
  });
  paintVoice();

  // leave the app and come back later: start a fresh chat automatically
  let hiddenAt = 0;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      hiddenAt = Date.now();
      stopSpeaking(true);
      if (listening && rec) { try { rec.abort(); } catch (e) {} }
    } else {
      if (hiddenAt && Date.now() - hiddenAt > AWAY_MS && current.messages.length) startNew();
      else setState("idle");
      hiddenAt = 0;
    }
  });
})();
</script>
</body>
</html>

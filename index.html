<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Friday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #070b16;
    --deep: #0e1428;
    --ember: #ff8a3d;
    --glow: #ffd9a0;
    --plum: #7a2f6b;
    --frost: #8fc4ff;
    --text: #eef0f7;
    --muted: #8a92ab;
    --line: #232b47;
    --orb: clamp(150px, 30dvh, 260px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 70% at 50% 0%, #141a35 0%, var(--night) 60%);
    color: var(--text);
    font-family: "Instrument Sans", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 0; padding-top: max(14px, env(safe-area-inset-top));
  }
  h1 {
    margin: 0; font-family: "Syne", sans-serif; font-weight: 700;
    font-size: 22px; letter-spacing: 0.02em;
  }
  .tools { display: flex; gap: 8px; }
  .chip {
    font: inherit; font-size: 13px; color: var(--muted);
    background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { color: var(--glow); border-color: #5a3a2a; }
  .chip:focus-visible, #orb:focus-visible, #send:focus-visible, #input:focus-visible {
    outline: 2px solid var(--frost); outline-offset: 3px;
  }

  /* ---- the orb ---- */
  .stage { display: grid; place-items: center; padding: 10px 0 4px; }
  #orb {
    position: relative; width: var(--orb); height: var(--orb);
    border: 0; padding: 0; background: none; cursor: pointer;
    border-radius: 50%; -webkit-tap-highlight-color: transparent;
  }
  .core, .halo, .ring { position: absolute; inset: 0; border-radius: 50%; }
  .core {
    background: radial-gradient(circle at 38% 32%, #fff6e6 0%, var(--glow) 18%, var(--ember) 46%, var(--plum) 80%, #2a1233 100%);
    box-shadow: 0 0 50px 8px rgba(255,138,61,.45), 0 0 130px 36px rgba(122,47,107,.35);
    animation: breathe 6s ease-in-out infinite;
    transition: filter .6s ease;
  }
  .halo {
    inset: -14%;
    background: radial-gradient(circle, rgba(255,138,61,.18) 40%, transparent 70%);
    animation: breathe 6s ease-in-out infinite reverse;
  }
  .ring {
    inset: -7%;
    background: conic-gradient(from 0deg, transparent 0 55%, rgba(255,217,160,.9) 75%, transparent 100%);
    -webkit-mask: radial-gradient(circle, transparent 66%, #000 67%, #000 69%, transparent 70%);
            mask: radial-gradient(circle, transparent 66%, #000 67%, #000 69%, transparent 70%);
    opacity: .35; animation: spin 14s linear infinite;
  }
  #orb[data-state="listening"] .core { filter: hue-rotate(185deg) saturate(1.2); animation: listen 1.2s ease-in-out infinite; }
  #orb[data-state="listening"] .ring { opacity: .8; animation-duration: 4s; }
  #orb[data-state="thinking"] .ring { opacity: 1; animation-duration: 1.1s; }
  #orb[data-state="speaking"] .core { animation: speak .8s ease-in-out infinite; }
  #orb[data-state="speaking"] .ring { opacity: .7; animation-duration: 6s; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
  @keyframes listen { 0%,100% { transform: scale(.97); } 50% { transform: scale(1.08); } }
  @keyframes speak { 0%,100% { transform: scale(1); } 30% { transform: scale(1.07); } 60% { transform: scale(.98); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { margin: 14px 0 0; font-size: 14px; color: var(--muted); min-height: 21px; text-align: center; }

  /* ---- conversation ---- */
  #log {
    flex: 1; overflow-y: auto; padding: 8px 16px 12px;
    display: flex; flex-direction: column; gap: 10px;
    mask-image: linear-gradient(to bottom, transparent 0, #000 18px);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 18px);
  }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: #17264a; color: #dbe9ff; border-bottom-right-radius: 5px; }
  .bot { align-self: flex-start; background: var(--deep); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
  .bot.pending { color: var(--muted); }
  .bot.error { border-color: #6b2a2a; color: #ffb4b4; }

  /* ---- input ---- */
  .bar {
    display: flex; gap: 8px; padding: 10px 12px; padding-bottom: max(12px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: rgba(7,11,22,.85);
  }
  #input {
    flex: 1; min-width: 0; font: inherit; color: var(--text);
    background: var(--deep); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px;
  }
  #input::placeholder { color: #5d667f; }
  #send {
    font: inherit; font-weight: 600; color: #1a0d05; background: var(--ember);
    border: 0; border-radius: 14px; padding: 0 18px; cursor: pointer;
  }
  #send:disabled { opacity: .5; }
  #send { align-self: stretch; }

  .tools { flex-wrap: wrap; justify-content: flex-end; }
  #memPanel {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end;
    background: rgba(3,5,12,.72);
  }
  #memPanel[hidden] { display: none; }
  .sheet {
    width: 100%; max-height: 75dvh; overflow-y: auto;
    background: var(--deep); border-top: 1px solid var(--line);
    border-radius: 20px 20px 0 0; padding: 18px 16px; padding-bottom: max(18px, env(safe-area-inset-bottom));
  }
  .sheet h2 { margin: 0 0 4px; font-family: "Syne", sans-serif; font-size: 18px; }
  .sheet p.hint { margin: 0 0 14px; font-size: 14px; color: var(--muted); }
  .fact { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .fact span { flex: 1; }
  .fact button { font: inherit; font-size: 13px; color: #ffb4b4; background: none; border: 1px solid #4a2a2f; border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  .sheet-actions { display: flex; gap: 8px; margin-top: 16px; }
  .sheet-actions .chip { flex: 1; padding: 10px; }

  @media (prefers-reduced-motion: reduce) {
    .core, .halo, .ring { animation: none !important; }
  }

  /* ---- header with menu ---- */
  .left { display: flex; align-items: center; gap: 10px; }
  .icon {
    width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer;
    background: transparent; border: 1px solid var(--line); border-radius: 12px; color: var(--text); padding: 0;
  }
  .icon:focus-visible, .newchat:focus-visible, .chat-row:focus-visible { outline: 2px solid var(--frost); outline-offset: 2px; }

  /* ---- chats drawer ---- */
  #drawer { position: fixed; inset: 0; z-index: 20; visibility: hidden; pointer-events: none; transition: visibility 0s .25s; }
  #drawer.open { visibility: visible; pointer-events: auto; transition-delay: 0s; }
  .scrim { position: absolute; inset: 0; background: rgba(3,5,12,.7); opacity: 0; transition: opacity .25s ease; }
  #drawer.open .scrim { opacity: 1; }
  .panel {
    position: absolute; top: 0; bottom: 0; left: 0; width: min(86vw, 340px);
    background: var(--deep); border-right: 1px solid var(--line);
    transform: translateX(-100%); transition: transform .25s ease;
    display: flex; flex-direction: column;
    padding: 14px 12px; padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: max(14px, env(safe-area-inset-bottom));
  }
  #drawer.open .panel { transform: none; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .panel-head strong { font-family: "Syne", sans-serif; font-size: 18px; }
  .newchat {
    font: inherit; font-weight: 600; color: #1a0d05; background: var(--ember);
    border: 0; border-radius: 12px; padding: 12px; cursor: pointer; margin-bottom: 12px;
  }
  #chatList { flex: 1; overflow-y: auto; }
  .chat-row {
    display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 12px; cursor: pointer;
    border: 1px solid transparent;
  }
  .chat-row.active { background: #151d38; border-color: var(--line); }
  .chat-main { flex: 1; min-width: 0; }
  .chat-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-time { font-size: 12px; color: var(--muted); }
  .chat-del { font: inherit; font-size: 13px; color: #ffb4b4; background: none; border: 0; padding: 6px; cursor: pointer; }
  .empty-note { color: var(--muted); font-size: 14px; padding: 8px 4px; }
  @media (prefers-reduced-motion: reduce) { .scrim, .panel { transition: none; } }

  /* ---- attachments ---- */
  .bar { position: relative; align-items: center; }
  #plus {
    width: 44px; height: 44px; flex: none; display: grid; place-items: center; cursor: pointer;
    background: var(--deep); border: 1px solid var(--line); border-radius: 14px; color: var(--glow); padding: 0;
  }
  #plus:focus-visible, .menu button:focus-visible, .x:focus-visible { outline: 2px solid var(--frost); outline-offset: 2px; }
  .menu {
    position: absolute; left: 12px; bottom: calc(100% + 6px); z-index: 5;
    background: var(--deep); border: 1px solid var(--line); border-radius: 16px; padding: 6px; min-width: 220px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  .menu[hidden] { display: none; }
  .menu button {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    font: inherit; color: var(--text); background: none; border: 0; border-radius: 10px; padding: 12px; cursor: pointer;
  }
  .menu button:active { background: #151d38; }
  #tray { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 12px 0; }
  #tray:empty { display: none; }
  .att {
    position: relative; display: flex; align-items: center; gap: 8px; max-width: 70%;
    background: var(--deep); border: 1px solid var(--line); border-radius: 12px; padding: 6px 30px 6px 8px; font-size: 13px;
  }
  .att img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; display: block; }
  .att .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .x {
    position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; display: grid; place-items: center;
    background: #1c2547; color: var(--text); border: 0; border-radius: 50%; font-size: 12px; cursor: pointer; padding: 0;
  }
  .thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .thumbs img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; }
  .file-chip { display: inline-block; font-size: 13px; color: var(--glow); border: 1px solid #5a3a2a; border-radius: 999px; padding: 2px 10px; margin-bottom: 6px; }
</style>
</head>
<body>
  <header>
    <div class="left">
      <button class="icon" id="menuBtn" aria-label="Open chats">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1>Friday</h1>
    </div>
    <div class="tools">
      <button class="chip" id="voiceToggle" aria-pressed="true">Studio voice</button>
      <button class="chip" id="memBtn">Memory</button>
    </div>
  </header>

  <section class="stage">
    <button id="orb" data-state="idle" aria-label="Talk to Friday">
      <span class="halo"></span><span class="core"></span><span class="ring"></span>
    </button>
    <p id="status" role="status">Tap the orb and talk, or type below</p>
  </section>

  <section id="log" aria-live="polite"></section>

  <div id="tray" aria-label="Attachments"></div>
  <div class="bar">
    <button id="plus" aria-label="Attach" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="menu" id="menu" hidden>
      <button id="pickCamera">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        Camera
      </button>
      <button id="pickPhoto">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg>
        Photo or screenshot
      </button>
      <button id="pickDoc">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>
        Document
      </button>
    </div>
    <input id="input" placeholder="Ask Friday anything" autocomplete="off" enterkeyhint="send">
    <button id="send">Send</button>
  </div>
  <input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
  <input type="file" id="filePhoto" accept="image/*" multiple hidden>
  <input type="file" id="fileDoc" accept=".pdf,.docx,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.xml,.yml,.yaml,.log,.java,.c,.cpp,.php,.sql,text/*" hidden>

  <div id="drawer">
    <div class="scrim" id="scrim"></div>
    <nav class="panel" aria-label="Chats">
      <div class="panel-head">
        <strong>Chats</strong>
        <button class="icon" id="drawerClose" aria-label="Close chats">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <button class="newchat" id="newChatBtn">New chat</button>
      <div id="chatList"></div>
    </nav>
  </div>

  <div id="memPanel" hidden>
    <div class="sheet" role="dialog" aria-label="What Friday remembers">
      <h2>What Friday remembers</h2>
      <p class="hint">Saved on this phone. Tell Friday "forget that" or remove items here.</p>
      <div id="memList"></div>
      <div class="sheet-actions">
        <button class="chip" id="memClear">Clear all</button>
        <button class="chip" id="memClose">Close</button>
      </div>
    </div>
  </div>

<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
(() => {
  const $ = (id) => document.getElementById(id);
  const orb = $("orb"), statusEl = $("status"), log = $("log"), input = $("input"), sendBtn = $("send");
  const voiceToggle = $("voiceToggle");
  const IDLE_TEXT = "Tap the orb and talk, or type below";
  const AWAY_MS = 30000; // leave the app this long, come back, and Friday opens a fresh chat
  const KEYS = { chats: "friday.chats", old: "friday.history", mem: "friday.memory", voice: "friday.voice" };

  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };

  let voiceMode = load(KEYS.voice, "studio"); // "studio" = Groq voice, "phone" = this phone's voice, "off"
  if (voiceMode === true) voiceMode = "studio";
  if (voiceMode === false || !["studio", "phone", "off"].includes(voiceMode)) voiceMode = voiceMode === false ? "off" : "studio";
  let studioFailedAt = 0; // if Groq's voice fails, use the phone voice for a few minutes
  let busy = false;

  /* ================= status + messages ================= */
  function setState(s, text) {
    orb.dataset.state = s;
    const labels = { idle: IDLE_TEXT, listening: "Listening", thinking: "Thinking", speaking: "Speaking. Tap to stop" };
    statusEl.textContent = text || labels[s];
  }
  function addMsg(text, cls, m) {
    const d = document.createElement("div");
    d.className = "msg " + cls;
    if (m && ((m.images && m.images.length) || m.imgCount || m.doc)) {
      if (m.images && m.images.length) {
        const wrap = document.createElement("div");
        wrap.className = "thumbs";
        m.images.forEach((u) => { const im = document.createElement("img"); im.src = u; im.alt = "Attached photo"; wrap.appendChild(im); });
        d.appendChild(wrap);
      } else if (m.imgCount) {
        const c = document.createElement("div");
        c.className = "file-chip";
        c.textContent = m.imgCount > 1 ? m.imgCount + " photos" : "Photo";
        d.appendChild(c);
      }
      if (m.doc) {
        const c = document.createElement("div");
        c.className = "file-chip";
        c.textContent = m.doc.name;
        d.appendChild(c);
        d.appendChild(document.createElement("br"));
      }
    }
    d.appendChild(document.createTextNode(text));
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  /* ================= chats (history drawer) ================= */
  let chats = load(KEYS.chats, []);
  // bring over the single chat saved by the earlier version
  const oldHistory = load(KEYS.old, null);
  if (oldHistory && oldHistory.length && !chats.length) {
    const first = oldHistory.find((m) => m.role === "user");
    chats = [{ id: "legacy", title: first ? first.content.slice(0, 40) : "Earlier chat", updated: Date.now(), messages: oldHistory }];
    store(KEYS.chats, chats);
  }
  try { localStorage.removeItem(KEYS.old); } catch (e) {}

  const newChat = () => ({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: "", updated: Date.now(), messages: [] });
  let current = newChat(); // every launch starts a fresh chat

  function persist() {
    if (!current.messages.length) return;
    const i = chats.findIndex((c) => c.id === current.id);
    if (i >= 0) chats[i] = current; else chats.unshift(current);
    chats = chats.sort((a, b) => b.updated - a.updated).slice(0, 50);
    const slim = (keepDocs) => chats.map((c) => ({
      ...c,
      messages: c.messages.slice(-60).map((m) => {
        const { images, ...rest } = m; // photos stay in memory only
        if (rest.doc && !(keepDocs || c.id === current.id)) rest.doc = { name: rest.doc.name, text: "" };
        return rest;
      })
    }));
    if (!store(KEYS.chats, slim(true))) {
      if (!store(KEYS.chats, slim(false))) {
        chats = chats.slice(0, 15);
        store(KEYS.chats, slim(false));
      }
    }
  }
  function renderChat() {
    log.innerHTML = "";
    current.messages.forEach((m) => addMsg(m.content, m.role === "user" ? "user" : "bot", m));
  }
  function startNew() {
    stopSpeaking();
    if (current.messages.length) current = newChat();
    renderChat();
    input.value = "";
    setState("idle");
  }
  function openChat(id) {
    const c = chats.find((x) => x.id === id);
    if (!c) return;
    stopSpeaking();
    current = c;
    renderChat();
    setState("idle");
    closeDrawer();
  }
  function renderList() {
    const list = $("chatList");
    list.innerHTML = "";
    const sorted = chats.slice().sort((a, b) => b.updated - a.updated);
    if (!sorted.length) {
      const p = document.createElement("p");
      p.className = "empty-note";
      p.textContent = "Your past chats will show up here.";
      list.appendChild(p);
      return;
    }
    sorted.forEach((c) => {
      const row = document.createElement("div");
      row.className = "chat-row" + (c.id === current.id ? " active" : "");
      row.tabIndex = 0;
      row.setAttribute("role", "button");
      const main = document.createElement("div");
      main.className = "chat-main";
      const t = document.createElement("div");
      t.className = "chat-title";
      t.textContent = c.title || "Chat";
      const when = document.createElement("div");
      when.className = "chat-time";
      when.textContent = new Date(c.updated).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      main.append(t, when);
      const del = document.createElement("button");
      del.className = "chat-del";
      del.textContent = "Delete";
      del.onclick = (e) => {
        e.stopPropagation();
        chats = chats.filter((x) => x.id !== c.id);
        store(KEYS.chats, chats);
        if (c.id === current.id) { current = newChat(); renderChat(); }
        renderList();
      };
      row.append(main, del);
      row.onclick = () => openChat(c.id);
      row.onkeydown = (e) => { if (e.key === "Enter") openChat(c.id); };
      list.appendChild(row);
    });
  }
  function openDrawer() { renderList(); $("drawer").classList.add("open"); }
  function closeDrawer() { $("drawer").classList.remove("open"); }
  $("menuBtn").onclick = openDrawer;
  $("drawerClose").onclick = closeDrawer;
  $("scrim").onclick = closeDrawer;
  $("newChatBtn").onclick = () => { startNew(); closeDrawer(); };

  // a short summary of earlier chats, so Friday can pick up where you left off
  function recentContext() {
    return chats
      .filter((c) => c.id !== current.id && c.messages.length)
      .sort((a, b) => b.updated - a.updated)
      .slice(0, 5)
      .map((c) => {
        const users = c.messages.filter((m) => m.role === "user");
        const bots = c.messages.filter((m) => m.role === "assistant");
        return {
          title: c.title,
          user: users.length ? users[users.length - 1].content : "",
          reply: bots.length ? bots[bots.length - 1].content : ""
        };
      });
  }

  /* ================= memory ================= */
  let memory = load(KEYS.mem, []);
  const memBtn = $("memBtn"), memPanel = $("memPanel"), memList = $("memList");
  function renderMem() {
    memBtn.textContent = memory.length ? "Memory (" + memory.length + ")" : "Memory";
    memList.innerHTML = "";
    if (!memory.length) {
      const p = document.createElement("p");
      p.className = "hint";
      p.textContent = "Nothing yet. Tell Friday about yourself and she'll start remembering.";
      memList.appendChild(p);
      return;
    }
    memory.forEach((f, i) => {
      const row = document.createElement("div");
      row.className = "fact";
      const t = document.createElement("span");
      t.textContent = f;
      const b = document.createElement("button");
      b.textContent = "Remove";
      b.onclick = () => { memory.splice(i, 1); store(KEYS.mem, memory); renderMem(); };
      row.append(t, b);
      memList.appendChild(row);
    });
  }
  async function remember(text) {
    try {
      const r = await fetch("/remember", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, memory })
      });
      const d = await r.json();
      if (Array.isArray(d.memory)) { memory = d.memory; store(KEYS.mem, memory); renderMem(); }
    } catch (e) {}
  }
  memBtn.onclick = () => { renderMem(); memPanel.hidden = false; };
  $("memClose").onclick = () => { memPanel.hidden = true; };
  memPanel.addEventListener("click", (e) => { if (e.target === memPanel) memPanel.hidden = true; });
  $("memClear").onclick = () => {
    if (confirm("Erase everything Friday remembers about you?")) { memory = []; store(KEYS.mem, memory); renderMem(); }
  };
  renderMem();

  /* ================= voice out ================= */
  const player = new Audio();
  player.preservesPitch = false;
  player.mozPreservesPitch = false;
  player.webkitPreservesPitch = false;
  const VOICE_RATE = 0.94; // slightly slower with pitch lowered = deeper voice
  let speakToken = 0;

  function prepareSpeech(text) {
    return text
      .replace(/```[\s\S]*?```/g, " I've put the code on screen. ")
      .replace(/https?:\/\/\S+/g, " link ")
      .replace(/[*_`#>~]/g, "")
      .replace(/\s+/g, " ")
      .trim()
      .slice(0, 700);
  }
  function chunkSpeech(text) {
    const sentences = text.match(/[^.!?\n]+[.!?]*\s*/g) || [text];
    const chunks = [];
    let cur = "";
    const push = () => { if (cur.trim()) chunks.push(cur.trim()); cur = ""; };
    sentences.forEach((s) => {
      while (s.length > 180) {
        let cut = s.lastIndexOf(" ", 180);
        if (cut < 60) cut = 180;
        if ((cur + s.slice(0, cut)).length > 180) push();
        cur += s.slice(0, cut) + " ";
        push();
        s = s.slice(cut);
      }
      if ((cur + s).length > 180) push();
      cur += s;
    });
    push();
    return chunks;
  }
  const fetchAudio = (text) =>
    fetch("/speak", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) })
      .then(async (r) => {
        if (!r.ok) {
          let raw = "";
          try { raw = (await r.json()).error || ""; } catch (e) {}
          const m = raw.match(/"message"\s*:\s*"([^"]+)"/);
          throw new Error((m ? m[1] : raw || "server error " + r.status).slice(0, 110));
        }
        return r.blob();
      });

  function playBlob(blob, token, onStart) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      const done = () => URL.revokeObjectURL(url);
      player.onended = () => { done(); resolve(); };
      player.onerror = () => { done(); reject(new Error("play")); };
      player.src = url;
      player.defaultPlaybackRate = VOICE_RATE;
      player.playbackRate = VOICE_RATE;
      player.play().then(() => { if (onStart) onStart(); if (token === speakToken) setState("speaking"); }).catch((e) => { done(); reject(e); });
    });
  }

  // the phone's own voice: picks the deepest male-sounding English voice it can find
  function browserSpeak(text, note) {
    if (!("speechSynthesis" in window)) { setState("idle", "This browser has no voice to speak with."); return; }
    const go = () => {
      const voices = speechSynthesis.getVoices().filter((v) => /^en/i.test(v.lang));
      const male = voices.find((v) => /male|david|mark|daniel|james|guy|ryan|alex|fred|x-iom|x-tpd|x-rjs/i.test(v.name) && !/female/i.test(v.name));
      const u = new SpeechSynthesisUtterance(text);
      if (male || voices[0]) u.voice = male || voices[0];
      u.pitch = 0.6;
      u.rate = 0.95;
      u.onstart = () => setState("speaking", note ? note + " Tap to stop." : undefined);
      u.onend = () => setState("idle");
      u.onerror = (e) => setState("idle", "Phone voice problem: " + ((e && e.error) || "unknown") + ". Check your media volume.");
      try { speechSynthesis.resume(); } catch (e) {}
      speechSynthesis.speak(u);
    };
    if (speechSynthesis.getVoices().length) return go();
    let done = false;
    const fin = () => { if (!done) { done = true; go(); } };
    speechSynthesis.onvoiceschanged = fin;
    setTimeout(fin, 800);
  }

  async function speak(raw) {
    if (voiceMode === "off") { setState("idle"); return; }
    stopSpeaking(true);
    const token = ++speakToken;
    const text = prepareSpeech(raw);
    const chunks = chunkSpeech(text);
    if (!chunks.length) { setState("idle"); return; }
    if (voiceMode === "phone") { browserSpeak(text); return; }
    if (Date.now() - studioFailedAt < 300000) { browserSpeak(text, "Studio voice is unavailable, using the phone voice."); return; }
    let started = false; // has any studio audio actually begun playing?
    let next = fetchAudio(chunks[0]);
    next.catch(() => {});
    try {
      for (let i = 0; i < chunks.length; i++) {
        const blob = await next;
        if (token !== speakToken) return;
        if (i + 1 < chunks.length) { next = fetchAudio(chunks[i + 1]); next.catch(() => {}); }
        await playBlob(blob, token, () => { started = true; });
        if (token !== speakToken) return;
      }
      setState("idle");
    } catch (e) {
      if (token !== speakToken) return;
      if (!started) {
        studioFailedAt = Date.now();
        browserSpeak(text, "Studio voice failed (" + (e && e.message ? e.message : "unknown") + "). Using the phone voice.");
      } else setState("idle");
    }
  }
  function stopSpeaking(silent) {
    speakToken++;
    try { player.pause(); } catch (e) {}
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    if (!silent) setState("idle");
  }

  /* ================= attachments ================= */
  const MAX_IMAGES = 3, MAX_DOC_CHARS = 12000;
  let pending = { images: [], doc: null };
  const tray = $("tray"), menu = $("menu"), plus = $("plus");

  function renderTray() {
    tray.innerHTML = "";
    const mk = (label, thumb, onRemove) => {
      const a = document.createElement("div");
      a.className = "att";
      if (thumb) { const im = document.createElement("img"); im.src = thumb; im.alt = ""; a.appendChild(im); }
      const n = document.createElement("span");
      n.className = "nm";
      n.textContent = label;
      const x = document.createElement("button");
      x.className = "x";
      x.setAttribute("aria-label", "Remove " + label);
      x.textContent = "\u2715";
      x.onclick = onRemove;
      a.append(n, x);
      tray.appendChild(a);
    };
    pending.images.forEach((im, i) => mk(im.name, im.dataUrl, () => { pending.images.splice(i, 1); renderTray(); }));
    if (pending.doc) mk(pending.doc.name, null, () => { pending.doc = null; renderTray(); });
  }
  function toggleMenu(show) {
    menu.hidden = !show;
    plus.setAttribute("aria-expanded", String(show));
  }
  plus.onclick = (e) => { e.stopPropagation(); toggleMenu(menu.hidden); };
  document.addEventListener("click", (e) => { if (!menu.hidden && !menu.contains(e.target)) toggleMenu(false); });
  $("pickCamera").onclick = () => { toggleMenu(false); $("fileCamera").click(); };
  $("pickPhoto").onclick = () => { toggleMenu(false); $("filePhoto").click(); };
  $("pickDoc").onclick = () => { toggleMenu(false); $("fileDoc").click(); };

  function shrinkImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const max = 1280;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Couldn't open that image.")); };
      img.src = url;
    });
  }
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src; s.onload = resolve; s.onerror = () => reject(new Error("Couldn't load the document reader. Check your connection."));
      document.head.appendChild(s);
    });
  }
  async function readPdf(file) {
    if (!window.pdfjsLib) {
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }
    const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    let text = "";
    for (let p = 1; p <= pdf.numPages && text.length < MAX_DOC_CHARS; p++) {
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      text += content.items.map((i) => i.str).join(" ") + "\n\n";
    }
    return text;
  }
  async function readDocx(file) {
    if (!window.mammoth) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
    const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return r.value;
  }
  async function readDoc(file) {
    const name = file.name || "document";
    const lower = name.toLowerCase();
    let text;
    if (lower.endsWith(".pdf") || file.type === "application/pdf") text = await readPdf(file);
    else if (lower.endsWith(".docx")) text = await readDocx(file);
    else if (/\.(xlsx|xls|pptx|ppt|doc|zip|rar|apk|exe)$/.test(lower)) throw new Error("That file type isn't supported yet. Use PDF, Word (.docx), or a text file.");
    else text = await file.text();
    text = (text || "").replace(/\u0000/g, "").trim();
    if (!text) throw new Error("I couldn't find any text in that file. If it's a scan, send the pages as photos instead.");
    let truncated = false;
    if (text.length > MAX_DOC_CHARS) { text = text.slice(0, MAX_DOC_CHARS); truncated = true; }
    return { name, text: truncated ? text + "\n[...document continues, only the first part was sent]" : text, truncated };
  }

  async function addImages(fileList) {
    for (const f of Array.from(fileList)) {
      if (pending.images.length >= MAX_IMAGES) { setState("idle", "Up to " + MAX_IMAGES + " photos at a time."); break; }
      try {
        setState("idle", "Preparing photo...");
        pending.images.push({ name: f.name || "Photo", dataUrl: await shrinkImage(f) });
        setState("idle");
      } catch (e) { setState("idle", e.message); }
    }
    renderTray();
  }
  async function addDoc(f) {
    if (!f) return;
    if (f.size > 15 * 1024 * 1024) { setState("idle", "That file is over 15 MB. Try a smaller one."); return; }
    try {
      setState("idle", "Reading " + f.name + "...");
      pending.doc = await readDoc(f);
      setState("idle", pending.doc.truncated ? "Long document. Friday will read the first part." : IDLE_TEXT);
    } catch (e) { setState("idle", e.message); }
    renderTray();
  }
  $("fileCamera").onchange = (e) => { addImages(e.target.files); e.target.value = ""; };
  $("filePhoto").onchange = (e) => { addImages(e.target.files); e.target.value = ""; };
  $("fileDoc").onchange = (e) => { addDoc(e.target.files[0]); e.target.value = ""; };

  // what the server needs: photos only on the newest photo message, documents on the last two
  function apiMessages() {
    const msgs = current.messages.slice(-20);
    let lastImg = -1;
    const docIdx = [];
    msgs.forEach((m, i) => { if (m.images && m.images.length) lastImg = i; if (m.doc && m.doc.text) docIdx.push(i); });
    const keep = new Set(docIdx.slice(-2));
    return msgs.map((m, i) => {
      const o = { role: m.role, content: m.content };
      if (i === lastImg) o.images = m.images;
      else if (m.imgCount) o.content += " [The user attached " + m.imgCount + " photo(s) here]";
      if (m.doc) {
        if (keep.has(i)) o.doc = { name: m.doc.name, text: m.doc.text };
        else o.content += " [The user attached the document " + m.doc.name + " here]";
      }
      return o;
    });
  }

  /* ================= chat ================= */
  async function send(text) {
    text = (text || "").trim();
    const hasAtt = pending.images.length > 0 || !!pending.doc;
    if ((!text && !hasAtt) || busy) return;
    if (!text) text = pending.images.length ? "What's in this?" : "Summarize this document for me.";
    busy = true; sendBtn.disabled = true;
    input.value = "";
    stopSpeaking(true);
    const msg = { role: "user", content: text };
    if (pending.images.length) { msg.images = pending.images.map((i) => i.dataUrl); msg.imgCount = msg.images.length; }
    if (pending.doc) msg.doc = { name: pending.doc.name, text: pending.doc.text };
    pending = { images: [], doc: null };
    renderTray();
    addMsg(text, "user", msg);
    current.messages.push(msg);
    if (!current.title) current.title = text.slice(0, 40);
    current.updated = Date.now();
    const bubble = addMsg("...", "bot pending");
    setState("thinking");
    try {
      const r = await fetch("/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: apiMessages(), memory, recent: recentContext() })
      });
      const data = await r.json();
      if (!r.ok || !data.reply) throw new Error(data.error || "No response");
      bubble.className = "msg bot";
      bubble.textContent = data.reply;
      current.messages.push({ role: "assistant", content: data.reply });
      current.updated = Date.now();
      persist();
      speak(data.reply);
      remember(text);
    } catch (e) {
      bubble.className = "msg bot error";
      bubble.textContent = "Friday couldn't answer. " + (e && e.message ? e.message : "");
      current.messages.pop();
      setState("idle");
    } finally {
      busy = false; sendBtn.disabled = false;
      log.scrollTop = log.scrollHeight;
    }
  }

  /* ================= voice in ================= */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, finalText = "";
  if (SR) {
    rec = new SR();
    rec.lang = navigator.language || "en-US";
    rec.interimResults = true;
    rec.continuous = false;
    rec.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += t; else interim += t;
      }
      input.value = finalText + interim;
    };
    rec.onend = () => {
      listening = false;
      if (finalText.trim()) send(finalText); else setState("idle");
      finalText = "";
    };
    rec.onerror = (e) => {
      listening = false; finalText = "";
      setState("idle", e.error === "not-allowed" ? "Microphone blocked. Allow mic access in your browser settings." : "Didn't catch that. Tap the orb and try again.");
    };
  }
  orb.addEventListener("click", () => {
    if (orb.dataset.state === "speaking") { stopSpeaking(); return; }
    if (!rec) { setState("idle", "Voice input isn't supported in this browser. Try Chrome."); return; }
    if (listening) { rec.stop(); return; }
    finalText = ""; input.value = "";
    try { rec.start(); listening = true; setState("listening"); } catch (e) {}
  });

  /* ================= controls ================= */
  sendBtn.addEventListener("click", () => send(input.value));
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(input.value); });
  const VOICE_LABEL = { studio: "Studio voice", phone: "Phone voice", off: "Voice off" };
  function paintVoice() {
    voiceToggle.setAttribute("aria-pressed", String(voiceMode !== "off"));
    voiceToggle.textContent = VOICE_LABEL[voiceMode];
  }
  voiceToggle.addEventListener("click", () => {
    voiceMode = voiceMode === "studio" ? "phone" : voiceMode === "phone" ? "off" : "studio";
    if (voiceMode === "studio") studioFailedAt = 0;
    store(KEYS.voice, voiceMode);
    paintVoice();
    stopSpeaking(true);
    setState("idle", voiceMode === "off" ? "Voice is off." : voiceMode === "phone" ? "Using this phone's voice." : "Using the studio voice.");
  });
  paintVoice();

  // leave the app and come back later: start a fresh chat automatically
  let hiddenAt = 0;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      hiddenAt = Date.now();
      stopSpeaking(true);
      if (listening && rec) { try { rec.abort(); } catch (e) {} }
    } else {
      if (hiddenAt && Date.now() - hiddenAt > AWAY_MS && current.messages.length) startNew();
      else setState("idle");
      hiddenAt = 0;
    }
  });
})();
</script>
</body>
</html>
